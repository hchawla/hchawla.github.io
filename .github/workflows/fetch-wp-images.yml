# One-time job: copy screenshots hotlinked from the old WordPress blog into the repo.
name: Fetch WordPress images
on:
  push:
    branches: [claude/project-thread-3pu9qd]
    paths: [.github/workflows/fetch-wp-images.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set -u
          fail=0
          for u in $(grep -rhoE 'https://securitytimes\.files\.wordpress\.com/[^)?" ]+' _posts | sort -u); do
            rel="${u#https://securitytimes.files.wordpress.com/}"
            out="assets/images/wp/$rel"
            mkdir -p "$(dirname "$out")"
            if curl -fsSL --retry 3 -o "$out" "$u"; then echo "ok $rel"; else echo "FAIL $rel"; rm -f "$out"; fail=$((fail+1)); fi
          done
          echo "failures: $fail"
          ls -laR assets/images/wp
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/wp
          git diff --cached --quiet || git commit -m "Save WordPress-hosted screenshots into assets/images/wp"
          git push
