# One-time check: build this branch and main the way GitHub Pages does, verify links, and compare.
name: Test build
on:
  push:
    branches: [claude/project-thread-3pu9qd]
    paths: [.github/workflows/test-build.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: branch }
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./branch, destination: ./out_branch }
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./main, destination: ./out_main }
      - name: Check and compare
        run: |
          sudo chown -R $USER out_branch out_main
          (cd out_branch && find . -type f | sort) > b.txt
          (cd out_main && find . -type f | sort) > m.txt
          echo "== file list diff (main vs branch)"; diff m.txt b.txt && echo "same files"
          fail=0
          cd out_branch
          for f in $(find . -name '*.html'); do
            for p in $(grep -oE '(src|href)="/[^"#]*"' "$f" | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
              t=".${p}"; [ -d "$t" ] && t="$t/index.html"
              [ -e "$t" ] || { echo "BROKEN $f -> $p"; fail=1; }
            done
          done
          echo "== redirects: $(grep -l 'Redirecting' -r 2017 | wc -l)"
          cd ..
          echo "== content diffs"
          for f in $(cd out_branch && find . -name '*.html'); do
            diff -q out_main/$f out_branch/$f >/dev/null || { echo "--- $f"; diff out_main/$f out_branch/$f | head -12; }
          done
          echo "== CNAME"; cat out_branch/CNAME; echo "== h2 on ctf"; grep -o "<h2>[^<]*</h2>" out_branch/ctf/index.html
          echo "== meta-line sample"; grep -o 'meta-line">[^<]*<' out_branch/ctf/overthewire/behemoth/level-0-1/index.html
          exit $fail
