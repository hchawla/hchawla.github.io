# One-time check: build the site the way GitHub Pages does and verify links.
name: Test build
on:
  push:
    branches: [claude/project-thread-3pu9qd]
    paths: [.github/workflows/test-build.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check output
        run: |
          cd _site
          echo "== pages"; find . -name '*.html' | sort
          fail=0
          for f in $(find . -name '*.html'); do
            for p in $(grep -oE '(src|href)="/[^"#]*"' "$f" | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
              t=".${p}"; [ -d "$t" ] && t="$t/index.html"
              case "$p" in /assets/css/*) continue;; esac
              [ -e "$t" ] || { echo "BROKEN $f -> $p"; fail=1; }
            done
          done
          echo "== redirect sample"; cat 2017/07/12/NatasL2021.html | head -20
          echo "== home post links"; grep -oE 'href="/overthewire[^"]*"' index.html | sort | uniq | wc -l
          exit $fail
